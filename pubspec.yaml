name: roble
description: "Cliente Flutter para la plataforma ROBLE de Uninorte OpenLab. Autenticación y CRUD sobre bases de datos PostgreSQL."
version: 1.10.0
homepage: https://github.com/augustosalazar/roble_api_database
repository: https://github.com/augustosalazar/roble_api_database
issue_tracker: https://github.com/augustosalazar/roble_api_database/issues

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  http: ^1.2.0
  crypto: ^3.0.3
  web: ^1.1.0
  flutter_secure_storage: ^10.3.1
  flutter:
    sdk: flutter
  socket_io_client: ^3.1.6
  # Login social nativo. Estan aqui y no inyectados en cada app porque el
  # pegamento era identico en todas: ~200 lineas por app que nadie deberia
  # reescribir. El paquete ya traia flutter_secure_storage, que tambien es un
  # plugin nativo, asi que esto no cambia la naturaleza de la dependencia.
  google_sign_in: ^7.2.0
  flutter_web_auth_2: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

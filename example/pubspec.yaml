name: roble_example
description: Ejemplo de uso del paquete roble
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 👇 importante: usa el paquete padre mediante ruta local
  roble:
    path: ../

  # Solo para el ejemplo: el paquete no depende de esto.
  url_launcher: ^6.3.0
  app_links: ^6.3.2

flutter:
  uses-material-design: true
